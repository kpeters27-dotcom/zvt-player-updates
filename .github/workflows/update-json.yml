name: update.json automatisch aktualisieren

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main

      - name: update.json erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((10#$MAJOR * 100 + 10#$MINOR))

          ASSET_NAME=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name | select(endswith(".apk"))][0]')

          if [ -z "$ASSET_NAME" ] || [ "$ASSET_NAME" = "null" ]; then
            echo "Keine APK im Release gefunden."
            exit 1
          fi

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME"

          SHA256=$(sha256sum "$ASSET_NAME" | cut -d' ' -f1)
          NOTES=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body')

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg sha256 "$SHA256" \
            --arg notes "$NOTES" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: $apkUrl,
              sha256: $sha256,
              notes: $notes
            }' > update.json

      - name: Änderung speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json

          if git diff --cached --quiet; then
            echo "Keine Änderung notwendig."
            exit 0
          fi

          git commit -m "Update update.json für ${{ github.event.release.tag_name }}"
          git push
